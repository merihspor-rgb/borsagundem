name: Update market data
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Yahoo Finance data
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          symbols = {'xu030':'XU030.IS','xu100':'XU100.IS','xbank':'XBANK.IS','xusin':'XUSIN.IS'}
          out = {'updatedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}
          for key, symbol in symbols.items():
              url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + urllib.parse.quote(symbol) + '?range=5d&interval=1d'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  payload = json.load(urllib.request.urlopen(req, timeout=20))
                  result = payload['chart']['result'][0]
                  meta = result.get('meta', {})
                  closes = [x for x in result['indicators']['quote'][0].get('close', []) if x is not None]
                  price = meta.get('regularMarketPrice') or closes[-1]
                  previous = closes[-2] if len(closes) > 1 else price
                  out[key] = {'price': price, 'change': price-previous, 'percent': (price-previous)*100/previous if previous else 0}
              except Exception as e:
                  out[key] = None
                  print(symbol, e)
          out['future'] = None
          with open('data.json','w') as f: json.dump(out,f,separators=(',',':'))
          PY
      - name: Publish updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || (git commit -m 'Update market data' && git push)
